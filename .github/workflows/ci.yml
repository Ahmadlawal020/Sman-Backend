name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroman_test
      NODE_ENV: test
      # Must differ — config/auth asserts it at boot.
      STAFF_ACCESS_TOKEN_SECRET: ci-staff-access-secret-not-used-in-production
      CUSTOMER_ACCESS_TOKEN_SECRET: ci-customer-access-secret-not-used-in-production
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      TERMII_API_KEY: ci_placeholder
      CLIENT_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails if two migrations claim the same index (a merge collision that
      # drizzle-kit check can miss once the journal keeps one and orphans the
      # other .sql). Cheap, so it runs first.
      - name: Check for duplicate migration numbers
        run: npm run check:migrations

      # Fails if the migration journal and the SQL files have drifted apart —
      # the exact class of breakage that made db:migrate hang before.
      - name: Check migration consistency
        run: npm run db:check

      # db:migrate is permanently disabled (see package.json /
      # docs/LIVE_DB_CUTOVER.md) — soroman_db is shared production, owned and
      # migrated by Django, and Drizzle must never run DDL against it. There
      # is deliberately no "apply migrations" step here anymore: it could
      # only ever fail, and did so as a false alarm rather than a real one.
      # The ephemeral postgres service above is kept for when a real test-copy
      # restore step (see LIVE_DB_CUTOVER.md §7) replaces it.

      - name: Test
        run: npm test

      - name: Audit (production dependencies)
        run: npm audit --omit=dev
