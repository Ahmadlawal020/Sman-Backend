name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soroman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/soroman_test
      NODE_ENV: test
      # Must differ — config/auth asserts it at boot.
      STAFF_ACCESS_TOKEN_SECRET: ci-staff-access-secret-not-used-in-production
      CUSTOMER_ACCESS_TOKEN_SECRET: ci-customer-access-secret-not-used-in-production
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      TERMII_API_KEY: ci_placeholder
      CLIENT_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails if two migrations claim the same index (a merge collision that
      # drizzle-kit check can miss once the journal keeps one and orphans the
      # other .sql). Cheap, so it runs first.
      - name: Check for duplicate migration numbers
        run: npm run check:migrations

      # Fails if the migration journal and the SQL files have drifted apart —
      # the exact class of breakage that made db:migrate hang before.
      - name: Check migration consistency
        run: npm run db:check

      # Provision the live schema into the ephemeral postgres SERVICE
      # CONTAINER above — localhost inside this runner, created per run and
      # destroyed with the job. This step cannot reach any real database:
      # both URLs below are pinned to the container, and the EC2 deploy
      # workflow (deploy.yml) runs no DB commands at all.
      #
      # Two layers, mirroring db/schema/sman/README.md:
      #  1. docs/live_schema.sql — the 81 Django-owned `public` tables
      #     (Django migrates these in production; tests just need the shape).
      #     The dump's \restrict/\unrestrict guards are stripped: they need a
      #     recent psql minor and add nothing on a throwaway database.
      #  2. drizzle-kit migrate with the sman config — Sman's own `sman`
      #     schema from the tracked db/migrations.sman baseline, exactly what
      #     production gets.
      # (npm run db:migrate stays permanently disabled — that guard protects
      # shared production soroman_db, which Django owns. This step is scoped
      # to the container by construction, not by discipline.)
      - name: Provision live-schema test database
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/soroman_test
        run: |
          sed '/^\\restrict/d;/^\\unrestrict/d' docs/live_schema.sql | psql "$PGURL" -v ON_ERROR_STOP=1 -q
          LIVE_DATABASE_URL="$PGURL" npx drizzle-kit migrate --config=drizzle.sman.config.js

      - name: Test
        run: npm test

      - name: Audit (production dependencies)
        run: npm audit --omit=dev
